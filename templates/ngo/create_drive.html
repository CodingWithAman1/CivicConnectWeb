<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Create Volunteer Drive</title>


<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


<!-- Bootstrap Icons -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">


<!-- Leaflet -->

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{

    background:#f5f7f8;

}


.hero{

    background:
    linear-gradient(
        135deg,
        #198754,
        #2fb96d
    );

    color:white;

    padding:35px;

    border-radius:20px;

}


.card{

    border:none;

    border-radius:18px;

}


#map{

    height:400px;

    width:100%;

    border-radius:15px;

}


.location-box{

    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);

    border-radius:12px;

    padding:15px;

}


</style>

</head>


<body>


<div class="container py-5">


<!-- ================================================= -->
<!-- HERO -->
<!-- ================================================= -->

<div class="hero mb-4">

    <h2>

        <i class="bi bi-megaphone-fill"></i>

        Create Volunteer Drive

    </h2>

    <p class="mb-0">

        Invite citizens to help solve a community issue.

    </p>

</div>



<!-- ================================================= -->
<!-- FORM CARD -->
<!-- ================================================= -->

<div class="card shadow">

<div class="card-body p-4">


{% if error %}

<div class="alert alert-danger">

    <i class="bi bi-exclamation-triangle-fill"></i>

    {{ error }}

</div>

{% endif %}


<form method="POST"
      id="driveForm">


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<div class="mb-3">

    <label class="form-label fw-bold">

        Drive Title

    </label>

    <input
        type="text"
        class="form-control"
        name="title"
        placeholder="Example: Community Park Cleanup"
        required>

</div>



<!-- ================================================= -->
<!-- DESCRIPTION -->
<!-- ================================================= -->

<div class="mb-3">

    <label class="form-label fw-bold">

        Description

    </label>

    <textarea
        class="form-control"
        rows="4"
        name="description"
        placeholder="Describe what volunteers will do..."
        required></textarea>

</div>



<!-- ================================================= -->
<!-- MEETING POINT -->
<!-- ================================================= -->

<div class="mb-4">

    <label class="form-label fw-bold">

        <i class="bi bi-geo-alt-fill text-danger"></i>

        Meeting Point

    </label>


    <div class="location-box">


        <p class="text-muted mb-3">

            <i class="bi bi-info-circle"></i>

            Click anywhere on the map to select the
            volunteer meeting point.

        </p>


        <!-- MAP -->

        <div id="map"></div>


        <!-- LOCATION STATUS -->

        <div class="alert alert-secondary mt-3 mb-0"
             id="locationStatus">

            <i class="bi bi-geo-alt"></i>

            No meeting point selected yet.

        </div>


        <!-- LOCATION NAME -->

        <div class="mt-3">

            <label class="form-label">

                Meeting Point Name

            </label>

            <input
                type="text"
                class="form-control"
                id="meeting_point"
                name="meeting_point"
                placeholder="Example: Central Park Gate"
                required>

            <div class="form-text">

                Enter a name for the location you selected.

            </div>

        </div>


    </div>


    <!-- HIDDEN COORDINATES -->

    <input
        type="hidden"
        id="latitude"
        name="latitude">


    <input
        type="hidden"
        id="longitude"
        name="longitude">

</div>



<!-- ================================================= -->
<!-- CONTACT -->
<!-- ================================================= -->

<div class="mb-3">

    <label class="form-label fw-bold">

        Contact Number

    </label>

    <input
        type="text"
        class="form-control"
        name="contact"
        placeholder="Optional">

</div>



<!-- ================================================= -->
<!-- DATE / TIME / VOLUNTEERS -->
<!-- ================================================= -->

<div class="row">


    <!-- DATE -->

    <div class="col-md-4 mb-3">

        <label class="form-label fw-bold">

            Date

        </label>

        <input
            type="date"
            class="form-control"
            name="date"
            required>

    </div>



    <!-- TIME -->

    <div class="col-md-4 mb-3">

        <label class="form-label fw-bold">

            Time

        </label>

        <input
            type="time"
            class="form-control"
            name="time"
            required>

    </div>



    <!-- VOLUNTEERS -->

    <div class="col-md-4 mb-3">

        <label class="form-label fw-bold">

            Volunteers Needed

        </label>

        <input
            type="number"
            class="form-control"
            name="needed"
            min="1"
            placeholder="10"
            required>

    </div>


</div>



<!-- ================================================= -->
<!-- INSTRUCTIONS -->
<!-- ================================================= -->

<div class="mb-4">

    <label class="form-label fw-bold">

        Special Instructions

    </label>

    <textarea
        class="form-control"
        rows="3"
        name="instructions"
        placeholder="Bring gloves, wear shoes, carry water, etc."></textarea>

</div>



<!-- ================================================= -->
<!-- BUTTONS -->
<!-- ================================================= -->

<div class="d-flex justify-content-between">


    <a
        href="{{ url_for('dashboard') }}"
        class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>

        Back

    </a>


    <button
        type="submit"
        class="btn btn-success"
        id="createButton">

        <i class="bi bi-check-circle-fill"></i>

        Create Drive

    </button>


</div>


</form>

</div>

</div>

</div>



<!-- ================================================= -->
<!-- LEAFLET -->
<!-- ================================================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


/* =====================================================
   INITIAL MAP
   ===================================================== */

const map = L.map("map").setView(
    [28.6139, 77.2090],
    12
);


/* =====================================================
   OPENSTREETMAP TILES
   ===================================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);



/* =====================================================
   MARKER
   ===================================================== */

let marker = null;



/* =====================================================
   CLICK ON MAP
   ===================================================== */

map.on(
    "click",
    function(e){

        const lat =
            e.latlng.lat;

        const lng =
            e.latlng.lng;


        /* Remove old marker */

        if(marker){

            map.removeLayer(marker);

        }


        /* Add new marker */

        marker = L.marker(
            [lat, lng]
        ).addTo(map);


        marker.bindPopup(
            "<b>Selected Meeting Point</b>"
        ).openPopup();


        /* Save coordinates */

        document.getElementById(
            "latitude"
        ).value = lat;


        document.getElementById(
            "longitude"
        ).value = lng;


        /* Update status */

        document.getElementById(
            "locationStatus"
        ).innerHTML =

            '<i class="bi bi-check-circle-fill"></i> ' +

            '<strong>Location selected</strong><br>' +

            'Latitude: ' +
            lat.toFixed(6) +

            '<br>' +

            'Longitude: ' +
            lng.toFixed(6);


        document.getElementById(
            "locationStatus"
        ).className =
            "alert alert-success mt-3 mb-0";

    }
);



/* =====================================================
   FORM VALIDATION
   ===================================================== */

document.getElementById(
    "driveForm"
).addEventListener(
    "submit",
    function(event){

        const latitude =
            document.getElementById(
                "latitude"
            ).value;


        const longitude =
            document.getElementById(
                "longitude"
            ).value;


        if(!latitude || !longitude){

            event.preventDefault();


            alert(
                "Please select a meeting point on the map."
            );


            return;

        }

    }
);


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
