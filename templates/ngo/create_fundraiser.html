<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Fundraiser | CivicConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

    <div class="container">

        <a
            href="{{ url_for('dashboard') }}"
            class="navbar-brand fw-bold">

            CivicConnect NGO

        </a>

    </div>

</nav>


<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="card shadow border-0">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">

                        <i class="bi bi-heart-fill me-2"></i>

                        Create Fundraiser

                    </h4>

                </div>


                <div class="card-body p-4">


                    <form
                        method="POST"
                        enctype="multipart/form-data">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Campaign Title

                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="What are you raising funds for?"
                                required>

                        </div>


                        <!-- TYPE -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Campaign Type

                            </label>

                            <select
                                name="campaign_type"
                                id="campaignType"
                                class="form-select"
                                required>

                                <option value="NGO Campaign">

                                    Independent NGO Campaign

                                </option>

                                <option value="Citizen Issue">

                                    For a Citizen Raised Issue

                                </option>

                            </select>

                        </div>


                        <!-- CITIZEN ISSUE -->

                        <div
                            class="mb-3"
                            id="issueSection"
                            style="display:none;">

                            <label class="form-label fw-semibold">

                                Select Citizen Issue

                            </label>

                            <select
                                name="complaint_id"
                                class="form-select">

                                <option value="">

                                    Select an issue

                                </option>


                                {% for complaint in complaints %}

                                <option
                                    value="{{ complaint.id }}">

                                    #{{ complaint.id }}
                                    -
                                    {{ complaint.title }}

                                </option>

                                {% endfor %}

                            </select>

                            <div class="form-text">

                                The selected complaint will be
                                displayed as the reference for this
                                fundraiser.

                            </div>

                        </div>


                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="6"
                                placeholder="Explain why the funds are needed..."
                                required></textarea>

                        </div>


                        <!-- TARGET -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Amount Needed (₹)

                            </label>

                            <input
                                type="number"
                                name="target_amount"
                                class="form-control"
                                min="1"
                                step="0.01"
                                placeholder="50000"
                                required>

                        </div>


                        <!-- IMAGE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Campaign Image

                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*">

                            <div class="form-text">

                                Upload an image showing the project,
                                campaign or requirement.

                            </div>

                        </div>


                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{{ url_for('fundraisers') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>


                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-plus-circle me-1"></i>

                                Create Fundraiser

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const campaignType =
    document.getElementById("campaignType");

const issueSection =
    document.getElementById("issueSection");


campaignType.addEventListener(
    "change",
    function() {

        if (this.value === "Citizen Issue") {

            issueSection.style.display = "block";

        } else {

            issueSection.style.display = "none";

        }

    }
);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
